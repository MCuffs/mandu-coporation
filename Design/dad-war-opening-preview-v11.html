<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>아빠 전쟁 · 시작 연출 미리보기</title><style>
@font-face{font-family:body;src:url('../Assets/Alley/Resources/Fonts/GothicA1-Bold.ttf')}@font-face{font-family:title;src:url('../Assets/Alley/Resources/Fonts/BlackHanSans-Regular.ttf')}*{box-sizing:border-box}body{margin:0;background:#171b18;color:white;font-family:body,sans-serif;display:flex;justify-content:center;gap:30px;padding:22px;align-items:center;min-height:100vh}.phone{height:min(90vh,850px);aspect-ratio:9/16;background:black;position:relative;overflow:hidden;box-shadow:0 0 0 2px #4c554d;border-radius:10px}.scene{position:absolute;inset:0}.art{width:100%;height:100%;object-fit:cover}.company{display:grid;place-items:center;background:#000;font:clamp(17px,2.2vw,27px) Arial,sans-serif;transition:opacity .35s}.titleword{position:absolute;top:9%;width:100%;text-align:center;font-family:title;font-size:clamp(36px,6vw,74px);color:#ffca38;-webkit-text-stroke:2px #24281d;paint-order:stroke fill;text-shadow:3px 5px #24281d;transform:rotate(-4deg);line-height:1.1}.titleword small{display:block;font-family:body;font-size:14px;color:#303023;-webkit-text-stroke:0;text-shadow:none;margin-bottom:13px}.start{position:absolute;bottom:6%;left:10%;width:80%;height:9%;border:3px solid #24281d;border-radius:11px;background:#ffc831;color:#252a21;box-shadow:0 5px #614820;font-family:body;font-size:25px;cursor:pointer}.start:active{transform:translateY(3px);box-shadow:0 2px #614820}.subtitle{position:absolute;bottom:3%;left:5%;width:90%;padding:16px 13px;border-radius:9px;background:#111d;font-size:clamp(17px,2vw,22px);line-height:1.6;min-height:95px}.subtitle b{font-size:14px;color:#ffd35a;display:block}.skip{position:absolute;top:17px;right:14px;border:1px solid #fff7;border-radius:18px;padding:8px 12px;background:#18221bc9;color:white;font-family:body;cursor:pointer}.storyart{animation:drift 4.5s linear forwards}@keyframes drift{from{transform:scale(1)}to{transform:scale(1.045)}}aside{max-width:350px;font-size:14px;line-height:1.8;color:#bac4b8}aside h1{font-size:25px;color:white}aside button{font-family:body;padding:10px 14px;margin:4px;border:0;border-radius:5px;cursor:pointer}aside .muted{font-size:12px;color:#97a591}.hidden{display:none!important}.end{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#26392e;text-align:center;gap:15px;font-size:22px}.end button{padding:12px 25px;font-family:body;cursor:pointer}.end small{font-size:13px;color:#c8d3c7}@media(max-width:750px){body{padding:0;display:block}.phone{height:100dvh;margin:auto;border-radius:0}aside{display:none}}
</style><main class="phone"><div id="splash" class="scene company">Mandu Corporation</div><div id="menu" class="scene hidden"><img class="art" src="../Assets/DadSchoolBoss/Art/V11Opening/title_keyart.png"><div class="titleword"><small>아빠, 장난이라니까!</small>아빠 전쟁</div><button class="start" id="start">게임 시작</button></div><div id="story" class="scene hidden"><img id="frame" class="art"><button class="skip" id="skip">건너뛰기</button><div id="caption" class="subtitle"></div></div><div id="end" class="scene end hidden"><strong>학교 앞 도착!</strong><small>게임에서는 이 지점에서 첫 전투로 연결합니다.</small><button id="again">시작 화면으로</button></div></main><aside><h1>아빠 전쟁</h1><p>시작 연출 미리보기</p><p>검은 회사명 화면 → 시작 화면 → 게임 시작을 누르면 시나리오 → 첫 전투 연결 지점.</p><button id="reboot">처음부터</button><button id="jump">시작 화면</button><p class="muted">원화 7장과 별도 텍스트를 조합한 브라우저 미리보기입니다. 음성·효과음·실제 전투·Unity 연결은 포함하지 않습니다. 컷을 누르면 다음으로 넘어갑니다.</p><p id="status"></p></aside><script>
const root='../Assets/DadSchoolBoss/Art/V11Opening/';const cuts=[['story_01_home.png','아들','아빠… 나 오늘 싸웠는데.',3000],['story_02_prank.png','아들','걔가 아빠를 데려왔어. 나도 아빠 데려가야 할 것 같아.',4500],['story_03_where.png','아빠 / 아들','“어디야.”\n“학교 앞인데…”',3000],['story_04_dash.png','아빠','가자.',1500],['story_05_panic.png','아들','아빠?! 장난이야! 아빠!!',3000],['story_06_school.png','','',1800]];let timers=[],index=0,phase='';const $=id=>document.getElementById(id);function later(fn,ms){timers.push(setTimeout(fn,ms))}function clear(){timers.forEach(clearTimeout);timers=[]}function show(id){clear();phase=id;['splash','menu','story','end'].forEach(x=>$(x).classList.toggle('hidden',x!==id));$('status').textContent=id==='story'?'시나리오 재생 중':id==='menu'?'게임 시작 입력 대기':id==='splash'?'회사명 표시':'첫 전투 연결 지점'}function boot(){show('splash');$('splash').style.opacity=0;later(()=>$('splash').style.opacity=1,50);later(()=>$('splash').style.opacity=0,1350);later(()=>show('menu'),1750)}function cut(n){if(n>=cuts.length){show('end');return}show('story');index=n;const [file,speaker,line,duration]=cuts[n];$('frame').src=root+file;$('frame').className='art';void $('frame').offsetWidth;$('frame').className='art storyart';$('caption').replaceChildren();$('caption').classList.toggle('hidden',!line);if(speaker){let b=document.createElement('b');b.textContent=speaker;$('caption').append(b)}$('caption').append(document.createTextNode(line));$('caption').style.whiteSpace='pre-line';later(()=>cut(n+1),duration)}$('start').onclick=()=>cut(0);$('frame').onclick=()=>cut(index+1);$('skip').onclick=()=>show('end');$('again').onclick=()=>show('menu');$('reboot').onclick=boot;$('jump').onclick=()=>show('menu');new URLSearchParams(location.search).get('screen')==='title'?show('menu'):boot();
</script></html>
